<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecteur HLS — 100% HTML</title>
  <style>
    :root{--bg:#0b0e12;--fg:#e8eef6;--muted:#9fb3c8;--acc:#3aa8ff}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      background:linear-gradient(180deg,#0b0e12,#0b0e12 60%,#0e141b);
      color:var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(960px,100%);
      background:#0f1621;
      border:1px solid #1e2a39;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .head{
      padding:16px 20px;
      border-bottom:1px solid #1e2a39;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 20px var(--acc)}
    .title{font-weight:600}
    .hint{margin-left:auto;font-size:12px;color:var(--muted)}
    .wrap{aspect-ratio:16/9;background:#0b0e12}
    video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
    .foot{padding:12px 16px;color:var(--muted);font-size:12px;border-top:1px solid #1e2a39}
    .pill{display:inline-block;padding:2px 8px;border:1px solid #2a3a51;border-radius:999px;margin-left:6px;color:#cfe4ff}
    a{color:#b9dcff}
    .err{color:#ffd5d5}
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="dot"></div>
      <div class="title">OM‑STREAM‑TV — Lecteur HLS</div>
      <div class="hint">Paramètre: <code>?src=</code>URL .m3u8</div>
    </div>
    <div class="wrap">
      <video id="video" playsinline controls autoplay muted></video>
    </div>
    <div class="foot">
      Par défaut, le flux est <span class="pill">http://vpsfyhi.cluster029.hosting.ovh.net/OM-STREAM-TV_latest.m3u8</span>.<br>
      Vous pouvez passer une autre URL via <code>?src=...</code>. Le lecteur utilise <em>hls.js</em> si nécessaire.
      <div id="status" class="err"></div>
    </div>
  </div>

  <!-- hls.js depuis CDN (ne fait rien si Safari supporte nativement HLS) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    (function(){
      const DEFAULT_SRC = "http://vpsfyhi.cluster029.hosting.ovh.net/OM-STREAM-TV_latest.m3u8";
      const params = new URLSearchParams(location.search);
      const src = (params.get("src") || DEFAULT_SRC).trim();
      const video = document.getElementById("video");
      const status = document.getElementById("status");

      // Ajout de quelques attributs utiles
      video.setAttribute("preload", "auto");
      video.setAttribute("controls", "true");
      video.setAttribute("muted", "true");

      // 1) Support natif (Safari/iOS)
      if (video.canPlayType("application/vnd.apple.mpegURL")) {
        video.src = src;
        video.play().catch(()=>{});
      } else if (window.Hls && window.Hls.isSupported()) {
        // 2) hls.js pour Chrome/Firefox/Edge/Desktop Android récents
        const hls = new Hls({
          lowLatencyMode: true,
          backBufferLength: 90,
          enableWorker: true,
          capLevelToPlayerSize: true,
        });
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(()=>{});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          console.warn("[HLS ERROR]", data);
          if (data?.fatal) {
            status.textContent = "Une erreur HLS fatale est survenue : " + (data?.details || data?.type || "inconnue");
          }
        });
      } else {
        // 3) Fallback ultime : on tente le src direct
        video.src = src;
        video.play().catch(()=>{});
      }
    })();
  </script>
</body>
</html>
