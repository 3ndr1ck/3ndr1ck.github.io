<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="robots" content="noindex, nofollow">
<title>OM Stream TV</title>

<!-- Video.js -->
<link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet" />

<style>
  :root { --accent:#ff1e1e; }
  body { background:#000; color:#fff; font-family: Arial, sans-serif; margin:0; display:flex; flex-direction:column; align-items:center; padding-bottom:72px; }
  #login { margin-top:48px; text-align:center; display:none; } /* login caché par défaut */
  #login input, #login button { padding:10px 14px; font-size:16px; margin:4px; }
  #error { color:#ff5a5a; min-height:1.2em; }
  .header { display:flex; align-items:center; justify-content:center; gap:20px; margin:20px 0; opacity:0; pointer-events:none; }
  .header.show { opacity:1; pointer-events:auto; transition:opacity .6s ease; }
  .header img { width:100px; height:auto; transform:translateY(-40px) scale(.92); opacity:0; transition: all .8s cubic-bezier(.68,-0.55,.265,1.55); }
  .header.show img { transform:translateY(0) scale(1); opacity:1; }
  #vs { width:120px; animation: vsPulse 2.2s ease-in-out infinite; }
  @keyframes vsPulse { 0%,100%{ transform:scale(1) rotate(0deg) } 50%{ transform:scale(1.12) rotate(8deg) } }
  #compteur-visiteurs { display:none; position:fixed; top:10px; left:10px; background:rgba(0,0,0,.5); padding:6px 10px; border-radius:6px; font-size:14px; line-height:1; color:#fff; backdrop-filter:blur(4px); z-index:1000; }
  .video-wrap { width:100%; max-width:1280px; aspect-ratio:16/9; display:none; position:relative; }
  .video-js { width:100%; height:100%; }
  .vjs-progress-control { display:none !important; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background:#111; color:#aaa; padding:10px 16px; font-size:14px; border-top:1px solid #222; text-align: center; }
  footer .brand { margin: 0; }
  footer .follow-x-button { display: flex; align-items: center; gap: 6px; color: #aaa; text-decoration: none; }
  footer .follow-x-button svg { display: inline-block; vertical-align: middle; }
  footer .follow-x-button span { display: inline-block; vertical-align: middle; }
  footer .follow-x-button:hover { color: var(--accent); }
  @media (min-width: 600px) { footer { flex-direction: row; gap: 12px; } }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <h2>Entrez le mot de passe</h2>
  <input type="password" id="passwordInput" placeholder="Mot de passe" autocomplete="current-password">
  <button id="loginBtn">Valider</button>
  <div id="error"></div>
</div>

<!-- Logos -->
<div class="header" id="header">
  <img id="logo-dom" src="" alt="Logo Domicile" />
  <img id="vs" src="" alt="VS" />
  <img id="logo-ext" src="" alt="Logo Extérieur" />
</div>

<!-- Compteur -->
<div id="compteur-visiteurs">Connectés : 0</div>

<!-- Player -->
<div class="video-wrap" id="videoWrap">
  <video
    id="my-video"
    class="video-js vjs-default-skin"
    controls
    preload="auto"
    playsinline
    webkit-playsinline
  >
    Votre navigateur ne supporte pas la balise vidéo.
  </video>
</div>

<!-- Libs -->
<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-http-streaming@2.15.0/dist/videojs-http-streaming.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ====== IP Check ====== */
async function checkIP() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    if (data.ip === '93.15.67.14') {
      document.getElementById('login').style.display = 'none';
      document.getElementById('header').classList.add('show');
      document.getElementById('videoWrap').style.display = 'block';
      document.getElementById('compteur-visiteurs').style.display = 'block';
      initPage();
      return true;
    }
    return false;
  } catch (err) {
    console.error('Erreur checkIP:', err);
    return false;
  }
}

/* ====== Mot de passe via fichier password (base64) ====== */
async function checkPassword() {
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  try {
    const res = await fetch('.password', { cache: 'no-store' });
    if (!res.ok) throw new Error("Impossible de charger le fichier .password");
    const storedPassword = atob((await res.text()).trim());
    const entered = document.getElementById('passwordInput').value;
    if (entered === storedPassword) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('header').classList.add('show');
      document.getElementById('videoWrap').style.display = 'block';
      document.getElementById('compteur-visiteurs').style.display = 'block';
      initPage();
    } else {
      errorEl.textContent = 'Mot de passe incorrect';
    }
  } catch (e) {
    errorEl.textContent = 'Erreur : ' + e.message;
  }
}

/* ====== Firebase compteur visiteurs ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDFxmBpV5nlMxjc811TmHCKJod_MrqG5Ak",
  authDomain: "compteur-f529c.firebaseapp.com",
  databaseURL: "https://compteur-f529c-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-f529c",
  storageBucket: "compteur-f529c.firebasestorage.app",
  messagingSenderId: "1098833478365",
  appId: "1:1098833478365:web:057a0cbeb3a7bc40d09134"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const connectionsRef = db.ref("/connections");
const connectedRef = db.ref(".info/connected");

connectedRef.on("value", (snap) => {
  if (snap.val() === true) {
    const con = connectionsRef.push(true);
    con.onDisconnect().remove();
  }
});
connectionsRef.on("value", (snap) => {
  document.getElementById("compteur-visiteurs").textContent = "Connectés : " + snap.numChildren();
});

/* ====== Player init : lit flux HLS depuis json.json (clé fluxUrl) ====== */
async function initPage() {
  try {
    const res = await fetch('json.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('json.json introuvable');
    const data = await res.json();

    if (data.domicile) document.getElementById('logo-dom').src = data.domicile;
    if (data.exterieur) document.getElementById('logo-ext').src = data.exterieur;
    if (data.vs) document.getElementById('vs').src = data.vs;

    const player = videojs('my-video', {
      controls: true,
      preload: 'auto',
      fluid: true,
      liveui: true,
      poster: data.playerBG
    });

    if (!data.fluxUrl || typeof data.fluxUrl !== 'string') {
      console.error('fluxUrl manquant dans json.json');
      return;
    }

    if (!/^https?:\/\//i.test(data.fluxUrl)) {
      console.warn('fluxUrl invalide:', data.fluxUrl);
    } else if (location.protocol === 'https:' && data.fluxUrl.startsWith('http://')) {
      console.warn('Flux HTTP détecté sous page HTTPS : risque de blocage Mixed Content.');
    }

    player.src({ src: data.fluxUrl, type: 'application/x-mpegURL' });

    player.ready(() => {
      player.play().catch(() => {
        player.muted(true);
        player.play().then(() => player.muted(false)).catch(()=>{});
      });
    });

    player.on('error', () => {
      const err = player.error();
      console.error('Video.js error:', err);
    });

  } catch (err) {
    console.error('Erreur initPage:', err);
  }
}

/* ====== Lancement ====== */
checkIP().then(bypassed => {
  if (!bypassed) {
    document.getElementById('login').style.display = 'block';
  }
});

document.getElementById('loginBtn').addEventListener('click', checkPassword);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });

document.addEventListener('contextmenu', e => e.preventDefault());
</script>

<footer>
    <p>© 2025 OM Stream TV - 🖕 BeIn Sport et Canal+</p>
    <a href="https://x.com/OmStreamtv" target="_blank" class="follow-x-button" aria-label="Suivre sur X">

        <span>Suivre sur X</span>
    </a>
</footer>

</body>
</html>
