<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>OM Stream TV</title>

    <link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.css" rel="stylesheet" />

    <style>
        .follow-x-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: white;
            color: black;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }
        .follow-x-button:hover {
            background-color: #e6e6e6;
            transform: translateY(-2px);
        }
        .follow-x-button svg {
            fill: currentColor;
        }
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }
        .header {
            display: none;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            gap: 10px;
        }
        .header img {
            width: 100px;
            height: auto;
        }
        .vs-text {
            font-size: 45px;
        }
        #compteur-visiteurs {
            font-size: 18px;
            margin-bottom: 15px;
        }
        .video-container {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            display: none;
        }
        .video-js {
            width: 100%;
            height: 100%;
        }
        .vjs-progress-control {
            display: none !important;
        }
        footer {
            width: 100%;
            text-align: center;
            padding: 5px 0;
            font-size: 18px;
            color: #888;
            background-color: #111;
            position: fixed;
            bottom: 0;
            left: 0;
            font-family: Arial, sans-serif;
        }
        #login {
            text-align: center;
            margin-top: 50px;
        }
        #login input {
            padding: 10px;
            font-size: 16px;
        }
        #login button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div id="login">
        <h2>Entrez le mot de passe</h2>
        <input type="password" id="passwordInput" placeholder="Mot de passe">
        <button onclick="checkPassword()">Valider</button>
        <p id="error"></p>
    </div>

    <div class="header">
        <img id="logo-dom" src="" alt="Logo Domicile" />
        <img id="vs" src="" alt="vs" />
        <img id="logo-ext" src="" alt="Logo Extérieur" />
    </div>

    <p id="compteur-visiteurs" style="display:none;">Nombre de personnes connectées : 0</p>

    <div class="video-container">
        <video id="my-video" class="video-js vjs-default-skin" controls preload="auto" poster="">
            Votre navigateur ne supporte pas la balise vidéo.
        </video>
    </div>

    <footer>
        <p>© 2025 OM Stream TV - 🖕 BeIn Sport et Canal+</p>
        <a href="https://x.com/OmStreamtv" target="_blank" class="follow-x-button" aria-label="Suivre sur X">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.901 1.144h3.284l-7.904 9.176L24 22.852h-6.165l-5.327-6.188L7.544 22.852H0l8.136-9.444L.475 1.144h6.398l4.992 5.793L18.901 1.144zm-2.128 1.834L7.56 21.054H5.405L16.634 2.978h2.139z"/>
            </svg>
            <span>Suivre sur X</span>
        </a>
    </footer>

    <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDFxmBpV5nlMxjc811TmHCKJod_MrqG5Ak",
            authDomain: "compteur-f529c.firebaseapp.com",
            databaseURL: "https://compteur-f529c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "compteur-f529c",
            storageBucket: "compteur-f529c.firebasestorage.app",
            messagingSenderId: "1098833478365",
            appId: "1:1098833478365:web:057a0cbeb3a7bc40d09134",
            measurementId: "G-XD6V9Y73NS",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const connectionsRef = db.ref("/connections");
        const connectedRef = db.ref(".info/connected");

        connectedRef.on("value", (snap) => {
            if (snap.val() === true) {
                const con = connectionsRef.push(true);
                con.onDisconnect().remove();
            }
        });
        connectionsRef.on("value", (snap) => {
            document.getElementById("compteur-visiteurs").textContent =
                "Nombre de personnes connectées : " + snap.numChildren();
        });

        async function checkPassword() {
            try {
                const res = await fetch('password');
                if (!res.ok) throw new Error('Impossible de charger le fichier password');
                const base64pass = await res.text();
                const storedPassword = atob(base64pass.trim());
                const enteredPassword = document.getElementById('passwordInput').value;

                if (enteredPassword === storedPassword) {
                    document.getElementById('login').style.display = 'none';
                    document.querySelector('.header').style.display = 'flex';
                    document.querySelector('.video-container').style.display = 'block';
                    document.getElementById('compteur-visiteurs').style.display = 'block';
                    initPage();
                } else {
                    document.getElementById('error').textContent = 'Mot de passe incorrect';
                }
            } catch (e) {
                document.getElementById('error').textContent = 'Erreur : ' + e.message;
            }
        }

        async function initPage() {
            try {
                const response = await fetch("json.json");
                const data = await response.json();

                document.getElementById("logo-dom").src = data.domicile;
                document.getElementById("logo-ext").src = data.exterieur;
                document.getElementById('vs').src = data.vs;
                
                const video = document.getElementById('my-video');
                video.poster = data.playerBG;
                
                if (data.fluxUrl) {
                    const player = videojs("my-video", {
                        autoplay: true,
                        muted: false,
                        controls: true,
                        fluid: true,
                        liveui: true,
                    });

                    // Utilisation de la librairie HLS.js pour gérer le flux HLS
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(data.fluxUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            player.play();
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        // Support natif pour les navigateurs comme Safari
                        video.src = data.fluxUrl;
                        video.addEventListener('loadedmetadata', () => {
                            player.play();
                        });
                    }

                } else {
                    console.error("Flux vidéo introuvable.");
                }
            } catch (error) {
                console.error("Erreur chargement JSON:", error);
            }
        }

        document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
</body>

</html>
